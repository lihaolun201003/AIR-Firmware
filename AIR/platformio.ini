; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_f411re_uart6

; HC-06 owns USART2 PA2/PA3. Requires SB13/SB14 OFF, SB62/SB63 ON.
[env:nucleo_f411re]
platform = ststm32@20.0.0
board = nucleo_f411re
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 9600
; Share the STM32duino 3.x compatibility header with dependency builds.
build_flags =
    -Iinclude
    -DSERIAL_RX_BUFFER_SIZE=256
test_framework = unity
test_speed = 115200
test_filter = test_pms_parser
extra_scripts = post:scripts/windows_paths.py
lib_deps =
    adafruit/Adafruit ILI9341@1.6.4

; Direct USART6 pins: module RXD -> PA11/CN10-14, TXD -> PA12/CN10-12.
; No solder bridge changes. USART2 stays on ST-Link VCP for 115200 diagnostics.
[env:nucleo_f411re_uart6]
extends = env:nucleo_f411re
monitor_speed = 115200
build_flags =
    ${env:nucleo_f411re.build_flags}
    -DAIR_BLUETOOTH_UART6=1

; Original six-field custom phone app protocol ($ENV,...#).
[env:nucleo_f411re_env]
extends = env:nucleo_f411re
build_flags =
    ${env:nucleo_f411re.build_flags}
    -DAIR_BLUETOOTH_BLINKER=0

; Original ST-Link VCP logging. HC-06 must be disconnected and the UART
; bridges restored before using this configuration on the board.
[env:nucleo_f411re_debug]
extends = env:nucleo_f411re
monitor_speed = 115200
build_flags =
    ${env:nucleo_f411re.build_flags}
    -DAIR_ENABLE_BLUETOOTH=0

; Runs portable protocol and parser tests on the PC without flashing the board.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<air_bluetooth.cpp>
build_flags =
    -Iinclude
    -std=c++17
    -Wall
    -Wextra
    -Werror
test_filter =
    test_air_bluetooth
    test_pms_parser

[env:native_env]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DAIR_BLUETOOTH_BLINKER=0
